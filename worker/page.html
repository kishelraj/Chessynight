async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Please try again.');return d}
function board(c,interactive=false){const black=(interactive?playerColor:c.turn())==='b';const squares=c.board().flat().map((p,i)=>({p,f:i%8,r:8-Math.floor(i/8)}));if(black)squares.reverse();let legal=selected?c.moves({square:selected,verbose:true}).map(m=>m.to):[];return '<div class="board" aria-label="Chessboard viewed from '+(black?'Black':'White')+'’s side">'+squares.map(({p,f,r},i)=>{let s='abcdefgh'[f]+r;return '<button '+(!interactive?'disabled':'')+' class="sq '+((f+r)%2===1?'dark ':'')+(p?.color==='w'?'white ':'')+(s===selected?'sel ':'')+(lastMove.includes(s)?'last ':'')+(p?'occupied ':'')+(legal.includes(s)?'target':'')+'" data-square="'+s+'" aria-label="'+s+(p?' '+(p.color==='w'?'white ':'black ')+({k:'king',q:'queen',r:'rook',b:'bishop',n:'knight',p:'pawn'}[p.type]):' empty')+'">'+(p?'<img class="piece" alt="" draggable="false" src="'+pieces[p.color+p.type]+'">':'')+(i%8===0?'<span class="coord rank-label">'+r+'</span>':'')+(i>=56?'<span class="coord file-label">'+s[0]+'</span>':'')+'</button>'}).join('')+'</div>'}
let content=null,challenge='classic',playerColor='w',busy=false,challengeTitle='Chessynight Start Set';
async function refresh(){content=await api('content');challenge=content.set.id;document.querySelector('#adminLink').classList.toggle('hidden',!content.admin)}
async function home(){activeNav('playNav');clearInterval(eventTimer);clearInterval(timer);app.className='';app.innerHTML='<p role="status">Loading challenge…</p>';try{await refresh();drawHome()}catch(e){app.innerHTML='<p class="error">'+esc(e.message)+'</p><button class="primary" id="reload">Retry</button>';document.querySelector('#reload').onclick=home}}
function options(chosen){return content.sets.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===chosen?'selected':'')+'>'+esc(s.title)+(s.date?' · '+esc(s.date):'')+'</option>').join('')}
function drawHome(){practiceMode=false;selected=null;lastMove=[];const priority=s=>s.id==='classic'?0:s.id==='woodpecker-puzzles'?1:2;const sets=[...content.sets].sort((a,b)=>priority(a)-priority(b));app.innerHTML='<section class="puzzle-picker"><div class="eyebrow">The club challenge</div><h1>Make your<br>next move count.</h1><p>Choose your challenge. Find the best moves and play for a place on the chessynight board.</p><form id="start"><div class="puzzle-nickname"><label for="nickname">Choose your nickname</label><input id="nickname" maxlength="24" minlength="2" required placeholder="What should we call you?" autocomplete="nickname" value="'+esc(nick)+'"><small>For timed challenges, your nickname appears on the leaderboard. Practice can start without one.</small></div><div class="puzzle-set-grid">'+sets.map(s=>{const classic=s.id==='classic',advanced=s.id==='woodpecker-puzzles';const title=classic?'Chessynight Start Set':advanced?'Advanced':s.title;return '<article class="puzzle-set-card"><span class="puzzle-set-icon" aria-hidden="true">'+(advanced?'♞':'♟')+'</span><div class="eyebrow">'+(classic?'Start here':advanced?'Step it up':'Club collection')+'</div><h2>'+esc(title)+'</h2><p>'+(classic?'Short tactical puzzles to sharpen your next move.':advanced?'A tougher collection for deeper calculation and focused practice.':'Explore this puzzle collection from chessynight.')+'</p><button class="primary" type="submit" name="puzzleSet" value="'+esc(s.id)+'" data-puzzle-set="'+esc(s.id)+'" aria-label="Play '+esc(title)+'">Play <span aria-hidden="true">&rarr;</span></button>'+practiceButtons(s)+'</article>'}).join('')+'</div><p id="error" class="error" role="alert"></p></form></section>';bindPractice();document.querySelector('#start').onsubmit=async e=>{e.preventDefault();nick=document.querySelector('#nickname').value.trim();challenge=e.submitter.value;const buttons=[...document.querySelectorAll('.puzzle-set-card button')];buttons.forEach(b=>b.disabled=true);try{const d=await api('start',{nickname:nick,challenge});id=d.id;puzzles=d.puzzles;challengeTitle=d.title;index=0;answers=[];solved=[];started=Date.now();finished=false;load();timer=setInterval(()=>{let el=document.querySelector('#clock');if(el)el.textContent=time(Date.now()-started)},1000)}catch(e){document.querySelector('#error').textContent=e.message;buttons.forEach(b=>b.disabled=false)}}}
function time(ms){let s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function load(){game=new Chess(puzzles[index].fen);playerColor=game.turn();selected=null;lastMove=[];locked=false;render()}
function render(){if(practiceMode){renderPractice();return}app.className='game';app.innerHTML='<div class="layout"><div id="board">'+board(game,true)+'</div><div class="panel"><div class="eyebrow">'+esc(challengeTitle)+' · '+esc(nick)+' · '+'Puzzle '+(index+1)+'</div><h1>'+(playerColor==='w'?'White':'Black')+' to move.</h1><p>'+esc(puzzles[index].title||'Find the best move')+'</p><div class="progress"><div style="width:'+index/puzzles.length*100+'%"></div></div><div class="stats"><div><small>Score</small><b id="score">'+solved.filter(Boolean).length*100+'</b></div><div><small>Time</small><b id="clock">'+time(Date.now()-started)+'</b></div></div><p class="status" id="status" role="status">Select a piece, then its destination.</p><div class="actions"><button class="secondary" id="skip">Skip puzzle</button><button class="primary hidden" id="next">'+(index===puzzles.length-1?'See results':'Next puzzle')+'</button></div><p><small>The opponent replies automatically. Faster time breaks a tie.</small></p></div></div>';bind();document.querySelector('#skip').onclick=()=>submitMove(null,true);document.querySelector('#next').onclick=next}
function bind(){const squares=[...document.querySelectorAll('[data-square]')];squares.forEach((el,i)=>{el.onclick=()=>move(el.dataset.square);el.onkeydown=e=>{const step={ArrowRight:1,ArrowLeft:-1,ArrowUp:-8,ArrowDown:8}[e.key];if(step){e.preventDefault();squares[Math.max(0,Math.min(63,i+step))].focus()}}})}
function move(s){if(locked||busy)return;const piece=game.get(s);if(piece?.color===playerColor){selected=s;document.querySelector('#board').innerHTML=board(game,true);bind();return}if(!selected)return;let m;const clone=new Chess(game.fen());try{const promotions=clone.moves({square:selected,verbose:true}).filter(m=>m.to===s&&m.promotion);let promotion='q';if(promotions.length){promotion=prompt('Promote to: q (queen), r (rook), b (bishop), n (knight)','q');if(!['q','r','b','n'].includes(promotion))return}m=clone.move({from:selected,to:s,promotion})}catch{document.querySelector('#status').textContent='That move is not legal. Choose another square.';return}submitMove(m.from+m.to+(m.promotion||''),false)}
async function animatePuzzleMove(position,move,container){if(!container.isConnected)return;const paths=[{from:move.from,to:move.to}];if(move.flags.includes('k'))paths.push({from:'h'+move.from[1],to:'f'+move.from[1]});if(move.flags.includes('q'))paths.push({from:'a'+move.from[1],to:'d'+move.from[1]});const sprites=paths.map(path=>{const piece=container.querySelector('[data-square="'+path.from+'"] .piece'),target=container.querySelector('[data-square="'+path.to+'"]');return piece&&target?{...path,source:piece.getBoundingClientRect(),target:target.getBoundingClientRect(),sprite:piece.cloneNode(true)}:null}).filter(Boolean);game=position;lastMove=[move.from,move.to];selected=null;container.innerHTML=board(game,true);bind();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;await Promise.all(sprites.map(async item=>{const destination=container.querySelector('[data-square="'+item.to+'"] .piece');if(!destination)return;destination.style.opacity='0';Object.assign(item.sprite.style,{position:'fixed',left:item.source.left+'px',top:item.source.top+'px',width:item.source.width+'px',height:item.source.height+'px',zIndex:'100',pointerEvents:'none',margin:'0'});item.sprite.classList.add('moving-piece');document.body.append(item.sprite);try{await item.sprite.animate([{transform:'translate(0,0)'},{transform:'translate('+(item.target.left+(item.target.width-item.source.width)/2-item.source.left)+'px,'+(item.target.top+(item.target.height-item.source.height)/2-item.source.top)+'px)'}],{duration:220,easing:'ease-in-out'}).finished}catch{}finally{item.sprite.remove();destination.style.opacity=''}}))}
async function submitMove(move,skip){if(busy||locked)return;busy=true;const container=document.querySelector('#board');document.querySelector('#skip').disabled=true;document.querySelector('#status').textContent='Checking…';try{const previous=new Chess(game.fen());const d=await api(practiceMode?'practice/move':'move',{id,index,move,skip,request:game.fen()+'|'+move+'|'+skip});if(!container.isConnected)return;if(move&&!skip&&!d.incorrect){const played=previous.move({from:move.slice(0,2),to:move.slice(2,4),promotion:move[4]});await animatePuzzleMove(new Chess(previous.fen()),played,container);if(previous.fen()!==d.fen){const reply=previous.moves({verbose:true}).find(candidate=>{const test=new Chess(previous.fen());test.move(candidate);return test.fen()===d.fen});if(reply)await animatePuzzleMove(new Chess(d.fen),reply,container)}}if(!container.isConnected)return;game=new Chess(d.fen);selected=null;solved[index]=d.solved;container.innerHTML=board(game,true);bind();const score=document.querySelector('#score');if(score)score.textContent=d.score;locked=d.done;document.querySelector('#status').textContent=d.incorrect?'Not quite. Try another move.':d.solved?'Correct!':d.failed?(skip?'Skipped.':'That was not the solution.'):'Correct move. Find the continuation.';if(d.done){document.querySelector('#skip').classList.add('hidden');document.querySelector('#next').classList.remove('hidden')}}catch(e){const status=document.querySelector('#status');if(container.isConnected&&status)status.textContent=e.message+' Please try again.'}finally{busy=false;const skipButton=document.querySelector('#skip');if(container.isConnected&&skipButton)skipButton.disabled=false}}
async function next(){if(practiceMode){await nextPractice();return}if(index<puzzles.length-1){index++;load();return}clearInterval(timer);const b=document.querySelector('#next');b.disabled=true;try{const d=await api('finish',{id});finished=true;app.className='';app.innerHTML='<section class="result panel"><div class="eyebrow">'+esc(challengeTitle)+' · Complete</div><h1>Nicely played, '+esc(nick)+'.</h1><div class="big">'+d.score+'<span style="font-size:28px"> / '+d.count*100+'</span></div><div class="stats"><div><small>Solved</small><b>'+d.score/100+' / '+d.count+'</b></div><div><small>Time</small><b>'+time(d.elapsed)+'</b></div><div><small>Your rank</small><b>#'+d.rank+'</b></div></div><p>Your result is saved to this puzzle set’s leaderboard.</p><div class="actions" style="justify-content:center"><button class="primary" id="leaders">See leaderboard</button><button class="secondary" id="again">Play again</button></div></section>';document.querySelector('#leaders').onclick=leaderboard;document.querySelector('#again').onclick=home}catch(e){document.querySelector('#status').textContent='Could not save your result. '+e.message+' Press See results to retry.';b.disabled=false}}

async function loadRanks(){const panel=document.querySelector('#leaders');panel.textContent='Loading results…';try{const d=await api('leaderboard?challenge='+encodeURIComponent(challenge));panel.innerHTML=d.rows.length?'<table><thead><tr><th>Rank</th><th>Nickname</th><th>Score</th><th>Time</th></tr></thead><tbody>'+d.rows.map((r,i)=>'<tr><td class="rank">'+(i+1)+'</td><td>'+esc(r.nickname)+'</td><td>'+r.score+' / '+d.count*100+'</td><td>'+time(r.elapsed)+'</td></tr>').join('')+'</tbody></table>':'<h2>The board is open.</h2><p>Be the first to finish this challenge.</p>'}catch(e){panel.innerHTML='<p class="error">'+esc(e.message)+'</p><button class="secondary" id="retry">Retry</button>';document.querySelector('#retry').onclick=loadRanks}}

function openPost(id){const p=content.posts.find(p=>p.id===id);if(!p)return;const dialog=document.querySelector('#postDialog'),event=p.type==='event',open=event&&phase(p)!=='past';dialog.innerHTML='<div class="dialog-head"><span class="eyebrow">'+esc(event?'Club event':p.type)+'</span><button class="close-dialog secondary" aria-label="Close event details">Close</button></div>'+imageHTML(p,'dialog-poster')+'<h2 id="dialogTitle">'+esc(p.title)+'</h2>'+(event?'<p class="event-meta">'+esc(when(p))+'<br>'+esc(hours(p))+'<br>'+esc(p.venue||'Venue to be announced')+'</p>':'')+'<p class="post-body">'+esc(p.body)+'</p>'+(event?extraInfo(p):'')+photoGallery([p],false)+(open?(p.link?'<a class="primary external-signup" href="'+esc(p.link)+'" target="_blank" rel="noopener noreferrer">Sign up for this event</a><p><small>Registration opens on the organiser’s linked page.</small></p>':'<section class="signup-section"><h3>Join this event</h3><form id="rsvpForm"><label for="rsvpName">Your name</label><input id="rsvpName" name="name" autocomplete="name" minlength="2" maxlength="80" required placeholder="What should we call you?"><label for="rsvpEmail">Email address</label><input id="rsvpEmail" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com"><label class="consent"><input type="checkbox" name="consent" required> Share my name and email with chessynight to manage this event sign-up.</label><button class="primary" type="submit">Count me in</button><p id="rsvpStatus" role="status"></p><small>Your details are visible to the organiser only. This form saves your sign-up; it does not send an email.</small></form></section>'):event?'<p class="tag">This event has ended. Sign-ups are closed.</p>':p.link?'<a class="secondary" href="'+esc(p.link)+'" target="_blank" rel="noopener noreferrer">Read more</a>':'')+(event?'<div class="event-utilities"><button class="secondary" data-calendar="'+esc(p.id)+'">Add to calendar</button><button class="secondary" data-share="'+esc(p.id)+'">Share event</button></div>':'')+'<div class="event-enquiry"><p>Have a question before joining?</p>'+whatsappLink(event?p:null)+'</div><p id="dialogShare" role="status"></p>';dialog.querySelector('.close-dialog').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}};if(!dialog.open)dialog.showModal();bindClub();const form=document.querySelector('#rsvpForm');if(form)form.onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;const status=document.querySelector('#rsvpStatus');status.textContent='Saving your sign-up…';try{const d=await api('register',{eventId:p.id,name:form.elements.namedItem('name').value,email:form.elements.namedItem('email').value,consent:form.elements.namedItem('consent').checked});dialog.querySelector('.signup-section').innerHTML='<div class="signup-success" role="status"><div class="eyebrow">You’re on the list</div><h3>See you across the board.</h3><p>'+esc(d.message)+'</p><p>'+esc(when(p))+' · '+esc(hours(p))+'</p><small>Save the event to your calendar below.</small></div>'}catch(err){status.className='error';status.textContent=err.message;button.disabled=false}}}
function calendar(p){if(!p)return;const value=s=>String(s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);const date=d=>new Date(d+'+08:00').toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//chessynight//Events//EN','BEGIN:VEVENT','UID:'+p.id+'@chessynight','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART:'+date(p.event_date),...(p.end_date?['DTEND:'+date(p.end_date)]:[]),'SUMMARY:'+value(p.title),'LOCATION:'+value(p.venue||''),'DESCRIPTION:'+value(p.body),'END:VEVENT','END:VCALENDAR'];const folded=lines.map(line=>{let out='',row='',len=0;for(const char of line){const n=new TextEncoder().encode(char).length;if(len+n>73){out+=row+'\r\n';row=' ';len=1}row+=char;len+=n}return out+row}).join('\r\n')+'\r\n';const url=URL.createObjectURL(new Blob([folded],{type:'text/calendar;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='chessy-night-event.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function sharePost(p){const url=location.origin+'/#event='+encodeURIComponent(p.id),notice=document.querySelector('#postDialog')?.open?document.querySelector('#dialogShare'):document.querySelector('#shareNotice');try{if(navigator.share)await navigator.share({title:p.title,text:'Join chessynight · '+p.title,url});else{await navigator.clipboard.writeText(url);notice.textContent='Event link copied.'}}catch(e){if(e.name!=='AbortError'){notice.textContent='Share this event: '+url}}}

 call you?"><label for="contactEmail">Email address</label><input id="contactEmail" type="email" name="email" autocomplete="email" required placeholder="you@example.com"><label for="contactMessage">Message</label><textarea id="contactMessage" name="message" required placeholder="Tell us what you are looking for"></textarea><button class="primary" type="submit">Continue in WhatsApp</button><p class="contact-status" id="contactStatus" role="status">Opens WhatsApp with your message. Review and send it there.</p></form></section></div><section class="team-section"><div class="eyebrow">The people behind the club</div><h2>Meet the team</h2><p class="team-intro">A few of the people who keep the boards ready, welcome new faces, and make each club night feel easy to join.</p><div class="team-grid"><article class="team-card"><div class="portrait-placeholder">Photo placeholder</div><div class="team-copy"><h3>chessynight founder</h3><p class="role">Founder & host</p><p>Shapes the club’s direction and makes sure every first visit has a friendly opening.</p></div></article><article class="team-card"><div class="portrait-placeholder">Photo placeholder</div><div class="team-copy"><h3>Community lead</h3><p class="role">Welcome & community</p><p>Helps new players find their way in, meet the group, and settle into a good game.</p></div></article><article class="team-card"><div class="portrait-placeholder">Photo placeholder</div><div class="team-copy"><h3>Event lead</h3><p class="role">Events & logistics</p><p>Keeps the venue details, boards, and meetup rhythm running smoothly.</p></div></article></div></section><p class="contact-footer-note">Prefer a quick question? Use WhatsApp and we’ll point you in the right direction.</p></section>';document.querySelector('#contactForm').onsubmit=e=>{e.preventDefault();const form=e.currentTarget;const data=new FormData(form);const message='Hi chessynight! My name is '+data.get('name')+'. Email: '+data.get('email')+'\n\n'+data.get('message');window.open('https://wa.me/60172188005?text='+encodeURIComponent(message),'_blank','noopener,noreferrer');document.querySelector('#contactStatus').textContent='Review and send your message in WhatsApp. Your details remain here if you need to try again.'}}
