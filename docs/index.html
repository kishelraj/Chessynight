async function api(path,body){const r=await fetch('https://chessy-night.kishelraj.chatgpt.site/api/'+path,{credentials:'omit',method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Please try again.');return d}
function board(c,interactive=false){const black=(interactive?playerColor:c.turn())==='b';const squares=c.board().flat().map((p,i)=>({p,f:i%8,r:8-Math.floor(i/8)}));if(black)squares.reverse();let legal=selected?c.moves({square:selected,verbose:true}).map(m=>m.to):[];return '<div class="board" aria-label="Chessboard viewed from '+(black?'Black':'White')+'’s side">'+squares.map(({p,f,r},i)=>{let s='abcdefgh'[f]+r;return '<button '+(!interactive?'disabled':'')+' class="sq '+((f+r)%2===1?'dark ':'')+(p?.color==='w'?'white ':'')+(s===selected?'sel ':'')+(lastMove.includes(s)?'last ':'')+(p?'occupied ':'')+(legal.includes(s)?'target':'')+'" data-square="'+s+'" aria-label="'+s+(p?' '+(p.color==='w'?'white ':'black ')+({k:'king',q:'queen',r:'rook',b:'bishop',n:'knight',p:'pawn'}[p.type]):' empty')+'">'+(p?'<img class="piece" alt="" draggable="false" src="'+pieces[p.color+p.type]+'">':'')+(i%8===0?'<span class="coord rank-label">'+r+'</span>':'')+(i>=56?'<span class="coord file-label">'+s[0]+'</span>':'')+'</button>'}).join('')+'</div>'}
let content=null,challenge='classic',playerColor='w',busy=false,challengeTitle='CHESSYNIGHT Start Set';
async function refresh(){content=await api('content');challenge=content.set.id;document.querySelector('#adminLink').classList.toggle('hidden',!content.admin)}
async function home(){activeNav('playNav');clearInterval(eventTimer);clearInterval(timer);app.className='';app.innerHTML='<p role="status">Loading challenge…</p>';try{await refresh();drawHome()}catch(e){app.innerHTML='<p class="error">'+esc(e.message)+'</p><button class="primary" id="reload">Retry</button>';document.querySelector('#reload').onclick=home}}
function options(chosen){return content.sets.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===chosen?'selected':'')+'>'+esc(s.title)+(s.date?' · '+esc(s.date):'')+'</option>').join('')}
let demoMediaCleanup;
function setupPuzzleDemo(){
 demoMediaCleanup?.();
 const image=document.querySelector('#puzzleDemoImage'),figure=document.querySelector('#puzzleDemo'),toggle=document.querySelector('#puzzleDemoToggle'),disclosure=document.querySelector('#puzzleDemoDisclosure');
 const mobile=matchMedia('(max-width:900px)'),reduce=matchMedia('(prefers-reduced-motion: reduce)');let expanded=false,paused=reduce.matches;
 function update(){const playing=!paused&&(!mobile.matches||expanded),src='https://chessy-night.kishelraj.chatgpt.site/posters/puzzle-patterns.'+(playing?'gif':'png')+'?v=4';if(image.getAttribute('src')!==src)image.src=src;figure.classList.toggle('demo-expanded',expanded);disclosure.setAttribute('aria-expanded',String(expanded));disclosure.querySelector('span').textContent=expanded?'Hide puzzle demo':'Watch a puzzle demo';disclosure.querySelector('.demo-chevron').textContent=expanded?'−':'+';toggle.textContent=playing?'Pause animation':'Play animation';toggle.setAttribute('aria-pressed',String(!playing))}
 disclosure.onclick=()=>{expanded=!expanded;if(expanded)paused=reduce.matches;update()};toggle.onclick=()=>{paused=!paused;update()};const motionChange=()=>{paused=reduce.matches;update()};mobile.addEventListener('change',update);reduce.addEventListener('change',motionChange);demoMediaCleanup=()=>{mobile.removeEventListener('change',update);reduce.removeEventListener('change',motionChange)};update();

function drawHome(){practiceMode=false;selected=null;lastMove=[];const priority=s=>s.id==='classic'?0:s.id==='woodpecker-puzzles'?1:2;const sets=[...content.sets].sort((a,b)=>priority(a)-priority(b));app.innerHTML='<section class="puzzle-picker"><form id="start"><div class="puzzle-intro"><div class="puzzle-intro-copy"><div class="eyebrow">The club challenge</div><h1>Make your<br>next move count.</h1><p>Choose your challenge. Find the best moves and play for a place on the CHESSYNIGHT board.</p><div class="puzzle-nickname"><label for="nickname">Choose your nickname</label><input id="nickname" maxlength="24" minlength="2" required placeholder="What should we call you?" autocomplete="nickname" value="'+esc(nick)+'"><small>For timed challenges, your nickname appears on the leaderboard. Practice can start without one.</small></div></div><button type="button" class="puzzle-demo-disclosure" id="puzzleDemoDisclosure" aria-expanded="false" aria-controls="puzzleDemo"><span>Watch a puzzle demo</span><span aria-hidden="true" class="demo-chevron">+</span></button><figure class="puzzle-demo" id="puzzleDemo"><img id="puzzleDemoImage" src="https://chessy-night.kishelraj.chatgpt.site/posters/puzzle-patterns.png?v=4" alt="Five solved chess puzzles awarding 100 demo points each, followed by a sample ranking board"><figcaption><span>Solve. Score. Climb the board.</span><button type="button" class="text-button" id="puzzleDemoToggle" aria-pressed="false">Pause animation</button></figcaption></figure></div><div class="puzzle-set-grid">'+sets.map(s=>{const classic=s.id==='classic',advanced=s.id==='woodpecker-puzzles';const title=s.title;return '<article class="puzzle-set-card"><span class="puzzle-set-icon" aria-hidden="true">'+(advanced?'♞':'♟')+'</span><div class="eyebrow">'+(classic?'Start here':advanced?'Step it up':'Club collection')+'</div><h2>'+esc(title)+'</h2><p>'+(classic?'Short tactical puzzles to sharpen your next move.':advanced?'A tougher collection for deeper calculation and focused practice.':'Explore this puzzle collection from CHESSYNIGHT.')+'</p><button class="primary" type="submit" name="puzzleSet" value="'+esc(s.id)+'" data-puzzle-set="'+esc(s.id)+'" aria-label="Play '+esc(title)+'">Play <span aria-hidden="true">&rarr;</span></button>'+practiceButtons(s)+'</article>'}).join('')+'</div><p id="error" class="error" role="alert"></p></form></section>';bindPractice();setupPuzzleDemo();document.querySelector('#start').onsubmit=async e=>{e.preventDefault();nick=document.querySelector('#nickname').value.trim();challenge=e.submitter.value;const buttons=[...document.querySelectorAll('.puzzle-set-card button')];buttons.forEach(b=>b.disabled=true);try{const d=await api('start',{nickname:nick,challenge});id=d.id;puzzles=d.puzzles;challengeTitle=d.title;index=0;answers=[];solved=[];started=Date.now();finished=false;load();timer=setInterval(()=>{let el=document.querySelector('#clock');if(el)el.textContent=time(Date.now()-started)},1000)}catch(e){document.querySelector('#error').textContent=e.message;buttons.forEach(b=>b.disabled=false)}}}
function time(ms){let s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function load(){game=new Chess(puzzles[index].fen);playerColor=game.turn();selected=null;lastMove=[];locked=false;render()}
function render(){if(practiceMode){renderPractice();return}app.className='game';app.innerHTML='<div class="layout"><div id="board">'+board(game,true)+'</div><div class="panel"><div class="eyebrow">'+esc(challengeTitle)+' · '+esc(nick)+' · '+'Puzzle '+(index+1)+'</div><h1>'+(playerColor==='w'?'White':'Black')+' to move.</h1><p>'+esc(puzzles[index].title||'Find the best move')+'</p><div class="progress"><div style="width:'+index/puzzles.length*100+'%"></div></div><div class="stats"><div><small>Score</small><b id="score">'+solved.filter(Boolean).length*100+'</b></div><div><small>Time</small><b id="clock">'+time(Date.now()-started)+'</b></div></div><p class="status" id="status" role="status">Select a piece, then its destination.</p><div class="actions"><button class="secondary" id="skip">Skip puzzle</button><button class="primary hidden" id="next">'+(index===puzzles.length-1?'See results':'Next puzzle')+'</button></div><p><small>The opponent replies automatically. Faster time breaks a tie.</small></p></div></div>';bind();document.querySelector('#skip').onclick=()=>submitMove(null,true);document.querySelector('#next').onclick=next}
function bind(){const squares=[...document.querySelectorAll('[data-square]')];squares.forEach((el,i)=>{el.onclick=()=>move(el.dataset.square);el.onkeydown=e=>{const step={ArrowRight:1,ArrowLeft:-1,ArrowUp:-8,ArrowDown:8}[e.key];if(step){e.preventDefault();squares[Math.max(0,Math.min(63,i+step))].focus()}}})}
function move(s){if(locked||busy)return;const piece=game.get(s);if(piece?.color===playerColor){selected=s;document.querySelector('#board').innerHTML=board(game,true);bind();return}if(!selected)return;let m;const clone=new Chess(game.fen());try{const promotions=clone.moves({square:selected,verbose:true}).filter(m=>m.to===s&&m.promotion);let promotion='q';if(promotions.length){promotion=prompt('Promote to: q (queen), r (rook), b (bishop), n (knight)','q');if(!['q','r','b','n'].includes(promotion))return}m=clone.move({from:selected,to:s,promotion})}catch{document.querySelector('#status').textContent='That move is not legal. Choose another square.';return}submitMove(m.from+m.to+(m.promotion||''),false)}
async function animatePuzzleMove(position,move,container){if(!container.isConnected)return;const paths=[{from:move.from,to:move.to}];if(move.flags.includes('k'))paths.push({from:'h'+move.from[1],to:'f'+move.from[1]});if(move.flags.includes('q'))paths.push({from:'a'+move.from[1],to:'d'+move.from[1]});const sprites=paths.map(path=>{const piece=container.querySelector('[data-square="'+path.from+'"] .piece'),target=container.querySelector('[data-square="'+path.to+'"]');return piece&&target?{...path,source:piece.getBoundingClientRect(),target:target.getBoundingClientRect(),sprite:piece.cloneNode(true)}:null}).filter(Boolean);game=position;lastMove=[move.from,move.to];selected=null;container.innerHTML=board(game,true);bind();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;await Promise.all(sprites.map(async item=>{const destination=container.querySelector('[data-square="'+item.to+'"] .piece');if(!destination)return;destination.style.opacity='0';Object.assign(item.sprite.style,{position:'fixed',left:item.source.left+'px',top:item.source.top+'px',width:item.source.width+'px',height:item.source.height+'px',zIndex:'100',pointerEvents:'none',margin:'0'});item.sprite.classList.add('moving-piece');document.body.append(item.sprite);try{await item.sprite.animate([{transform:'translate(0,0)'},{transform:'translate('+(item.target.left+(item.target.width-item.source.width)/2-item.source.left)+'px,'+(item.target.top+(item.target.height-item.source.height)/2-item.source.top)+'px)'}],{duration:220,easing:'ease-in-out'}).finished}catch{}finally{item.sprite.remove();destination.style.opacity=''}}))}
async function submitMove(move,skip){if(busy||locked)return;busy=true;const container=document.querySelector('#board');document.querySelector('#skip').disabled=true;document.querySelector('#status').textContent='Checking…';try{const previous=new Chess(game.fen());const d=await api(practiceMode?'practice/move':'move',{id,index,move,skip,request:game.fen()+'|'+move+'|'+skip});if(!container.isConnected)return;if(move&&!skip&&!d.incorrect){const played=previous.move({from:move.slice(0,2),to:move.slice(2,4),promotion:move[4]});await animatePuzzleMove(new Chess(previous.fen()),played,container);if(previous.fen()!==d.fen){const reply=previous.moves({verbose:true}).find(candidate=>{const test=new Chess(previous.fen());test.move(candidate);return test.fen()===d.fen});if(reply)await animatePuzzleMove(new Chess(d.fen),reply,container)}}if(!container.isConnected)return;game=new Chess(d.fen);selected=null;solved[index]=d.solved;container.innerHTML=board(game,true);bind();const score=document.querySelector('#score');if(score)score.textContent=d.score;locked=d.done;document.querySelector('#status').textContent=d.incorrect?'Not quite. Try another move.':d.solved?'Correct!':d.failed?(skip?'Skipped.':'That was not the solution.'):'Correct move. Find the continuation.';if(d.done){document.querySelector('#skip').classList.add('hidden');document.querySelector('#next').classList.remove('hidden')}}catch(e){const status=document.querySelector('#status');if(container.isConnected&&status)status.textContent=e.message+' Please try again.'}finally{busy=false;const skipButton=document.querySelector('#skip');if(container.isConnected&&skipButton)skipButton.disabled=false}}
async function next(){if(practiceMode){await nextPractice();return}if(index<puzzles.length-1){index++;load();return}clearInterval(timer);const b=document.querySelector('#next');b.disabled=true;try{const d=await api('finish',{id});finished=true;app.className='';app.innerHTML='<section class="result panel"><div class="eyebrow">'+esc(challengeTitle)+' · Complete</div><h1>Nicely played, '+esc(nick)+'.</h1><div class="big">'+d.score+'<span style="font-size:28px"> / '+d.count*100+'</span></div><div class="stats"><div><small>Solved</small><b>'+d.score/100+' / '+d.count+'</b></div><div><small>Time</small><b>'+time(d.elapsed)+'</b></div><div><small>Your rank</small><b>#'+d.rank+'</b></div></div><p>Your result is saved to this puzzle set’s leaderboard.</p><div class="actions" style="justify-content:center"><button class="primary" id="leaders">See leaderboard</button><button class="secondary" id="again">Play again</button></div></section>';document.querySelector('#leaders').onclick=leaderboard;document.querySelector('#again').onclick=home}catch(e){document.querySelector('#status').textContent='Could not save your result. '+e.message+' Press See results to retry.';b.disabled=false}}
function leave(){return practiceMode||!(id&&!finished&&app.className==='game')||confirm('Leave this unfinished attempt? Your score will not be saved.')}
async function leaderboard(){if(!leave())return;activeNav('rankNav');clearInterval(eventTimer);clearInterval(timer);app.className='';if(!content)try{await refresh()}catch(e){app.textContent=e.message;return}app.innerHTML='<div class="eyebrow">Club leaderboard</div><h1>The leaderboard.</h1><label for="rankingSet">Puzzle set</label><select id="rankingSet">'+options(challenge)+'</select><p>Highest score first. Faster finish wins a tie. Each completed attempt is listed.</p><div id="leaders" class="panel" role="status">Loading results…</div>';document.querySelector('#rankingSet').onchange=e=>{challenge=e.target.value;loadRanks()};loadRanks()}
async function loadRanks(){const panel=document.querySelector('#leaders');panel.textContent='Loading results…';try{const d=await api('leaderboard?challenge='+encodeURIComponent(challenge));panel.innerHTML=d.rows.length?'<table><thead><tr><th>Rank</th><th>Nickname</th><th>Score</th><th>Time</th></tr></thead><tbody>'+d.rows.map((r,i)=>'<tr><td class="rank">'+(i+1)+'</td><td>'+esc(r.nickname)+'</td><td>'+r.score+' / '+d.count*100+'</td><td>'+time(r.elapsed)+'</td></tr>').join('')+'</tbody></table>':'<h2>The board is open.</h2><p>Be the first to finish this challenge.</p>'}catch(e){panel.innerHTML='<p class="error">'+esc(e.message)+'</p><button class="secondary" id="retry">Retry</button>';document.querySelector('#retry').onclick=loadRanks}}

function photoGallery(posts,heading=true){const events=posts.filter(p=>photoList(p).length);if(!events.length)return '';const shuffle=items=>{for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return items};const grid=p=>{let photos=photoList(p).map((photo,index)=>({...photo,index}));if(heading)photos=shuffle(photos);return '<div class="gallery-grid">'+photos.slice(0,heading?6:8).map(photo=>'<figure><button data-photo-event="'+esc(p.id)+'" data-photo-index="'+photo.index+'" aria-label="View photo: '+esc(photo.caption||p.title)+'"><img src="'+esc(assetURL(photo.url))+'" alt="'+esc(photo.caption||'CHESSYNIGHT meetup: '+p.title)+'" loading="lazy"></button><figcaption>'+esc(photo.caption||'')+'</figcaption></figure>').join('')+'</div>'};if(!heading)return '<section class="meetup-gallery">'+events.map(grid).join('')+'</section>';return '<section class="meetup-gallery event-memories"><div class="eyebrow">Our club nights</div><h2>Across the board.</h2><p>Moments from CHESSYNIGHT meetups.</p><div class="gallery-navigation"><p class="memories-swipe-hint">Swipe for another club night &rarr;</p><div class="gallery-controls"><button type="button" class="secondary" data-gallery-auto aria-label="Pause automatic event slideshow" aria-pressed="false">Pause</button><button type="button" class="secondary" data-gallery-prev aria-label="Previous event photos">&larr;</button><span class="gallery-position" aria-live="polite"></span><button type="button" class="secondary" data-gallery-next aria-label="Next event photos">&rarr;</button></div></div><div class="event-photo-track" tabindex="0" role="region" aria-label="Photos by event">'+shuffle(events).map(p=>'<article class="event-photo-card"><h3>'+esc(p.title)+'</h3>'+grid(p)+'</article>').join('')+'</div></section>'}
function bindPhotoTracks(){
 document.querySelectorAll('.event-photo-track').forEach(track=>{
  if(track.dataset.bound)return;track.dataset.bound='true';
  const section=track.closest('.event-memories'),cards=[...track.children],previous=section.querySelector('[data-gallery-prev]'),next=section.querySelector('[data-gallery-next]'),position=section.querySelector('.gallery-position'),autoButton=section.querySelector('[data-gallery-auto]');
  section.querySelector('.gallery-navigation').hidden=cards.length<2;
  const current=()=>cards.reduce((best,card,i)=>Math.abs(card.offsetLeft-cards[0].offsetLeft-track.scrollLeft)<Math.abs(cards[best].offsetLeft-cards[0].offsetLeft-track.scrollLeft)?i:best,0);
  const update=()=>{const i=current();position.textContent=(i+1)+' / '+cards.length;previous.disabled=next.disabled=cards.length<2};
  const moveTo=i=>{const card=cards[((i%cards.length)+cards.length)%cards.length];track.scrollTo({left:card.offsetLeft-cards[0].offsetLeft,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})};
  previous.onclick=()=>moveTo(current()-1);next.onclick=()=>moveTo(current()+1);track.onscroll=update;
  track.onkeydown=e=>{if(e.target!==track||!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();moveTo(current()+(e.key==='ArrowRight'?1:-1))};
  let drag=null,suppressClick=false;
  track.ondragstart=e=>e.preventDefault();
  track.onpointerdown=e=>{if(e.isPrimary!==false&&(e.pointerType!=='mouse'||e.button===0))drag={x:e.clientX,y:e.clientY,type:e.pointerType,left:track.scrollLeft,index:current(),distance:0,moved:false,id:e.pointerId}};
  track.onpointermove=e=>{if(!drag)return;if(drag.type==='mouse'&&!(e.buttons&1)){finish();return}const distance=e.clientX-drag.x,vertical=e.clientY-drag.y;drag.distance=distance;if(!drag.moved&&drag.type!=='mouse'&&Math.abs(vertical)>8&&Math.abs(vertical)>Math.abs(distance)){drag=null;return}if(!drag.moved&&Math.abs(distance)>8){drag.moved=true;track.setPointerCapture(drag.id);track.classList.add('is-dragging')}if(drag.moved){e.preventDefault();track.scrollLeft=drag.left-Math.max(-track.clientWidth,Math.min(track.clientWidth,distance))}};
  const finish=e=>{if(!drag)return;const {moved,id,index,distance}=drag,cancelled=e&&e.type!=='pointerup';drag=null;track.classList.remove('is-dragging');if(track.hasPointerCapture(id))track.releasePointerCapture(id);if(moved){suppressClick=true;moveTo(index+(!cancelled&&Math.abs(distance)>=24?(distance<0?1:-1):0));setTimeout(()=>suppressClick=false,0)}};
  track.onpointerup=finish;track.onpointercancel=finish;track.onlostpointercapture=e=>{if(e.target===track)finish(e)};
  track.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation()}},true);
  // Treat a trackpad swipe and its momentum as one event change.
  let wheelDistance=0,wheelLocked=false,wheelTimer;
  track.addEventListener('wheel',e=>{if(e.ctrlKey)return;const horizontal=e.deltaX||(e.shiftKey?e.deltaY:0);if(!horizontal||(!e.shiftKey&&Math.abs(e.deltaY)>Math.abs(horizontal)))return;e.preventDefault();clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{wheelDistance=0;wheelLocked=false},240);if(wheelLocked)return;wheelDistance+=horizontal*(e.deltaMode===1?16:e.deltaMode===2?track.clientWidth:1);if(Math.abs(wheelDistance)>=24){wheelLocked=true;moveTo(current()+(wheelDistance>0?1:-1))}},{passive:false});
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');let autoPaused=reduced.matches,autoTimer;
  const inputEvents=['pointerdown','pointerup','pointermove','keydown','wheel'];
  const dispose=()=>{clearTimeout(autoTimer);clearTimeout(wheelTimer);for(const event of inputEvents)document.removeEventListener(event,schedule);document.removeEventListener('visibilitychange',schedule);reduced.removeEventListener('change',motionChange)};
  function schedule(){clearTimeout(autoTimer);autoTimer=setTimeout(()=>{if(!track.isConnected){dispose();return}const box=track.getBoundingClientRect();if(cards.length>1&&!autoPaused&&!drag&&!document.hidden&&!document.querySelector('dialog[open]')&&box.bottom>0&&box.top<innerHeight)moveTo(current()+1);schedule()},5000)}
  const updateAuto=()=>{autoButton.textContent=autoPaused?'Play':'Pause';autoButton.setAttribute('aria-label',autoPaused?'Start automatic event slideshow':'Pause automatic event slideshow');autoButton.setAttribute('aria-pressed',String(autoPaused));position.setAttribute('aria-live',autoPaused?'polite':'off');schedule()};
  const motionChange=()=>{autoPaused=reduced.matches;updateAuto()};
  autoButton.onclick=()=>{autoPaused=!autoPaused;updateAuto()};
  for(const event of inputEvents)document.addEventListener(event,schedule,{passive:true});document.addEventListener('visibilitychange',schedule);reduced.addEventListener('change',motionChange);
  updateAuto();
  update();
 });
}

const eventStart=p=>new Date(p.event_date+'+08:00');
const eventEnd=p=>new Date((p.end_date||p.event_date.slice(0,10)+'T23:59')+'+08:00');
function phase(p){return Date.now()>=eventEnd(p).getTime()?'past':Date.now()>=eventStart(p).getTime()?'live':'upcoming'}
function when(p){return eventStart(p).toLocaleDateString('en-MY',{timeZone:'Asia/Kuala_Lumpur',weekday:'long',day:'numeric',month:'long',year:'numeric'})}

function setupEventCarousel(){const track=document.querySelector('#clubPosts'),controls=document.querySelector('.event-carousel-controls'),cards=[...track.querySelectorAll('.club-card')];controls.hidden=clubFilter!=='past'||!cards.length;let index=0;const update=()=>{index=cards.reduce((best,c,i)=>Math.abs(c.offsetLeft-track.offsetLeft-track.scrollLeft)<Math.abs(cards[best].offsetLeft-track.offsetLeft-track.scrollLeft)?i:best,0);document.querySelector('#eventPosition').textContent=(index+1)+' of '+cards.length;document.querySelector('#eventPrev').disabled=index===0;document.querySelector('#eventNext').disabled=index===cards.length-1};track.onscroll=()=>requestAnimationFrame(update);const move=dir=>{const next=Math.max(0,Math.min(cards.length-1,index+dir));track.scrollTo({left:cards[next].offsetLeft-track.offsetLeft,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})};document.querySelector('#eventPrev').onclick=()=>move(-1);document.querySelector('#eventNext').onclick=()=>move(1);if(cards.length)update()}
